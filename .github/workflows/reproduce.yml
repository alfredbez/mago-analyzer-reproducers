name: Confirm reported analyzer diagnostics

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAGO_VERSION: "1.55.0"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mago ${{ env.MAGO_VERSION }}
        run: |
          curl -sSfL "https://github.com/carthage-software/mago/releases/download/${MAGO_VERSION}/mago-${MAGO_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          chmod +x "mago-${MAGO_VERSION}-x86_64-unknown-linux-gnu/mago"

      - name: Assert known-bad output on ${{ env.MAGO_VERSION }}
        run: python3 verify.py "mago-${{ env.MAGO_VERSION }}-x86_64-unknown-linux-gnu/mago"
